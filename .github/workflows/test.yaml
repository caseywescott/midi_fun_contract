name: Tests

on: [push, pull_request]

# One Scarb workspace (the root Scarb.toml; scarb 2.20.1, as in /.tool-versions). Each package runs
# its own tests. The parity fixtures are #[ignore]d here: they need several GB per batch; run them
# locally (beasts/beast_composer/README.md).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.20.1"
      - run: scarb fmt --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - midi
          - midi_contracts
          - beast_composer
          - beast_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.20.1"
      - run: scarb test -p ${{ matrix.package }}
