name: Tests

on: [push, pull_request]

# One Scarb workspace (the root Scarb.toml; scarb 2.21.0 and starknet-foundry 0.64.1, as in
# /.tool-versions). Each package runs its own tests, on snforge. The parity fixtures are #[ignore]d
# here: they need several GB per batch; run them locally (beasts/beast_composer/README.md).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.21.0"
      - run: scarb fmt --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - midi
          - midi_contracts
          - beast_composer
          - beast_composer_inputs
          - beast_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.21.0"
      # `scarb test` runs snforge (the root Scarb.toml's [workspace.scripts]).
      - uses: foundry-rs/setup-snfoundry@v6
        with:
          starknet-foundry-version: "0.64.1"
      - name: Validate catalogue generation and size checker
        if: matrix.package == 'beast_contracts'
        run: |
          node --test offchain/beast-sound/test/catalogue-generation.test.mjs offchain/beast-sound/test/production-size.test.mjs
          node scripts/check_catalogue.mjs --check
      - run: scarb test -p ${{ matrix.package }}
      - name: Check production contract sizes
        if: matrix.package == 'beast_contracts'
        run: |
          scarb --profile dev build -p beast_contracts
          node scripts/check_production_size.mjs target/dev
      # Scarb.lock pins every git dependency to a commit: a build that changes it means a dependency
      # moved.
      - run: git diff --exit-code Scarb.lock
