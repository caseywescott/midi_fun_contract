# One workspace, two systems:
# - core/: the MIDI system. `midi` (library: types, interfaces, Standard MIDI Files) and
#   `midi_contracts` (contracts: the sound page, an example provider).
# - beasts/: Beast Sound, a consumer of `midi`. `beast_composer` (library: the composer) and
#   `beast_contracts` (contracts: BeastMidiProvider). Nothing in core/ depends on it.
# A package named *_contracts declares Starknet contracts; the others are [lib] only.
[workspace]
members = [
    "core/midi",
    "core/midi_contracts",
    "beasts/beast_composer",
    "beasts/beast_composer/inputs",
    "beasts/beast_contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2025_12"

[workspace.dependencies]
# Packages depend on `midi` through this entry (`midi.workspace = true`), so a workspace elsewhere
# (beasts/ moved to its own repository) points it at a git dependency on this repository instead.
midi = { path = "core/midi" }
# TinySynthSettings, TinySynthSound, ISoundProvider and settings::validate (Provable-Games/onchain-midi-player).
onchain_midi_player = { git = "https://github.com/Provable-Games/onchain-midi-player", rev = "38d76ce6120d964502891c16445ce083bf1bfedd" }
# OpenZeppelin Cairo: Ownable and Upgradeable for BeastMidiProvider.
openzeppelin_access = "4.0.1"
openzeppelin_upgrades = "4.0.1"
openzeppelin_interfaces = "2.2.0"
starknet = "2.21.0"
# Tests run on Starknet Foundry (snforge, pinned in /.tool-versions); assert_macros gives them
# assert_eq! and friends.
snforge_std = "=0.64.1"
assert_macros = "2.21.0"

# `scarb test` runs snforge in every package (`[scripts] test.workspace = true`). The step cap is
# lifted: some tests and every #[ignore]d parity fixture run far past snforge's default 10M steps.
# Four threads, not snforge's default of every core: at most half of a current laptop's cores, and
# what CI's 4-core runner runs, so a local run holds the memory CI does. For more threads, run
# `snforge test --max-n-steps 4294967295 --max-threads <n>` in the package.
[workspace.scripts]
test = "snforge test --max-n-steps 4294967295 --max-threads 4"
