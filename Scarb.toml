# One workspace, two systems:
# - core/: the MIDI system. `midi` (library: types, interfaces, Standard MIDI Files) and
#   `midi_contracts` (contracts: the sound page, an example provider).
# - beasts/: Beast Sound, a consumer of `midi`. `beast_composer` (library: the composer) and
#   `beast_contracts` (contracts: BeastMidiProvider). Nothing in core/ depends on it.
# A package named *_contracts declares Starknet contracts; the others are [lib] only.
[workspace]
members = [
    "core/midi",
    "core/midi_contracts",
    "beasts/beast_composer",
    "beasts/beast_contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2025_12"

[workspace.dependencies]
# Packages depend on `midi` through this entry (`midi.workspace = true`), so a workspace elsewhere
# (beasts/ moved to its own repository) points it at a git dependency on this repository instead.
midi = { path = "core/midi" }
# TinySynthSettings, TinySynthSound, ISoundProvider and settings::validate (Provable-Games/onchain-midi-player).
onchain_midi_player = { git = "https://github.com/Provable-Games/onchain-midi-player", rev = "38d76ce6120d964502891c16445ce083bf1bfedd" }
starknet = "2.20.1"
cairo_test = "2.20.1"
