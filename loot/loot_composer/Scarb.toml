[package]
name = "loot_composer"
version.workspace = true
edition.workspace = true
description = "Loot Dungeon Sound composer: Editions, Rounds and Sound Checks (Cairo port of offchain/loot-sound/src)."

[dependencies]
midi.workspace = true
beast_composer.workspace = true
beast_composer_inputs.workspace = true

[dev-dependencies]
snforge_std.workspace = true
assert_macros.workspace = true

[features]
default = ["songs_fx", "editions_fx", "gas_fx", "rounds_fx", "checks_fx", "played_fx"]
songs_fx = []
editions_fx = []
gas_fx = []
rounds_fx = []
checks_fx = ["rounds_fx"] # checks_parity uses rounds_parity::hex
played_fx = []

[lib]

[scripts]
test.workspace = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
