[package]
name = "loot_contracts"
version.workspace = true
edition.workspace = true
description = "Loot Dungeon Sound contracts: the composer class(es) and the FM sound pack."

[dependencies]
loot_composer = { path = "../loot_composer" }
midi.workspace = true
beast_composer.workspace = true
beast_composer_inputs.workspace = true
openzeppelin_access.workspace = true
openzeppelin_upgrades.workspace = true
openzeppelin_interfaces.workspace = true
starknet.workspace = true

[dev-dependencies]
beast_contracts = { path = "../deps/beast_contracts" }
snforge_std.workspace = true
assert_macros.workspace = true

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["beast_contracts::pure_composer::BeastPureComposer"]

[scripts]
test.workspace = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
